# FineGroupHub panel — reverse proxy + TLS sonlandırma.
#
# ⚠️ Bu dosya bir Nginx CONTAINER'I başlatmaz. Sunucuda TEK bir paylaşılan
# Nginx çalışır (bu reponun dışında, ayrı bir altyapı kurulumunda) ve tüm
# projelerin (finegrouphub-app, finegrouphub-api, sunucudaki diğer projeler)
# route tanımları o paylaşılan Nginx'in `conf.d/` dizinine bu şekilde tek
# tek dosya olarak eklenir. Bu depo yalnızca KENDİ route parçasını sağlar.
#
# Ön koşul: paylaşılan Nginx, bu servisin de üzerinde olduğu
# `container-network` iç ağına bağlı olmalı — `server finegrouphub_app:3000`
# adres çözümlemesi Docker'ın gömülü DNS'i üzerinden, ancak aynı ağdaysa
# çalışır. Farklı bir compose projesinden yönetiliyorsa, container adı yerine
# statik IP (192.168.20.83) kullanılabilir.
#
# Kurulum:
#   1. Domain'i aşağıda `panel.example.com` yerine yazın.
#   2. Bu dosyayı paylaşılan Nginx'in `conf.d/` dizinine kopyalayın/mount edin.
#   3. Certbot ile sertifika alın (bkz. dosya sonundaki not) ve Nginx'i reload edin.

upstream finegrouphub_panel {
    server finegrouphub_app:3000;
    keepalive 32;
}

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Görsel/dosya yükleme akışı için (ImageUpload/FileInput 50MB'a kadar izin
    # veriyor — bkz. src/common/inputs/FileInput.tsx MAX_FILE_SIZE).
    client_max_body_size 50M;
    client_body_timeout  120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript font/ttf
               application/x-javascript text/xml application/xml image/svg+xml;

    # Next.js immutable build asset'leri — uzun süreli cache
    location /_next/static/ {
        proxy_pass http://finegrouphub_panel;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/ altındaki statik dosyalar
    location ~* \.(svg|jpg|jpeg|png|gif|ico|webp|woff2?|ttf)$ {
        proxy_pass http://finegrouphub_panel;
        add_header Cache-Control "public, max-age=86400";
    }

    # PWA service worker — ASLA cache'lenmemeli
    location = /sw.js {
        proxy_pass http://finegrouphub_panel;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://finegrouphub_panel;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ Next.js middleware'i (middleware.ts) secure cookie ve https
        # yönlendirmeleri için bu header'a bakar; eksik olursa oturum
        # cookie'si production'da hiç yazılmaz.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
        # RSC/streaming yanıtları buffer'a takılmasın diye kapalı.
        proxy_buffering        off;
    }
}

# Certbot yenileme (host üzerinde, container dışında):
#   0 3 * * * certbot renew --quiet --deploy-hook \
#     "docker exec finegrouphub_nginx nginx -s reload"
